[package]
name = "quicklime-gui"
version = "1.2.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# unstable-winit-030: キーの取り込みで HWND をサブクラス化するため、winit のウィンドウから HWND を取る
slint = { version = "=1.16.1", features = ["unstable-winit-030"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
] }

[build-dependencies]
slint-build = "=1.16.1"
winresource = "0.1"
