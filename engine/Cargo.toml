[package]
name = "quicklime-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
# named pipe サーバ用 (Windows では \\.\pipe\ にマップされる)
interprocess = "2"
# 日付・時刻の動的候補用 (ローカル時刻の取得と日付計算)
chrono = "0.4"
# 辞書の検索構造 (有限状態トランスデューサ)。完全一致・前方一致・共通接頭辞検索に使う
fst = "0.4"
# 単語登録ツール (src/bin/quicklime-regword.rs) の Win32 ダイアログ用
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_Globalization",
    # LLM の子プロセスをジョブオブジェクトに入れてエンジンの終了に巻き込む (src/llm.rs)
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
] }
# LLM 計測用の example (examples/llm_bench.rs) 専用。feature llm-bench を指定したときだけビルドする
# openmp は llama.cpp 単体ビルドの既定 (GGML_OPENMP=ON) に揃えるため。common は使わないので外す
llama-cpp-2 = { version = "=0.1.158", optional = true, default-features = false, features = ["openmp"] }

[build-dependencies]
winresource = "0.1"

[features]
llm-bench = ["dep:llama-cpp-2"]
llm-bench-vulkan = ["llm-bench", "llama-cpp-2/vulkan"]

[[example]]
name = "llm_bench"
required-features = ["llm-bench"]
