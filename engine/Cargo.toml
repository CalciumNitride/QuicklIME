[package]
name = "quicklime-engine"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

# 設定ツール・単語登録ツールの画面 (gui) を別 crate にし、エンジン本体の依存に Slint を入れない。
# target を engine/target/ のまま共有するので、exe の置き場所は変わらない
[workspace]
members = [".", "gui"]
default-members = [".", "gui"]

[dependencies]
# named pipe サーバ用 (Windows では \\.\pipe\ にマップされる)
interprocess = "2"
# 日付・時刻の動的候補用 (ローカル時刻の取得と日付計算)
chrono = "0.4"
# 辞書の検索構造 (有限状態トランスデューサ)。完全一致・前方一致・共通接頭辞検索に使う
fst = "0.4"
# 二重起動の防止 (src/main.rs の名前付き mutex) と、LLM の子プロセスをジョブオブジェクトに入れて
# エンジンの終了に巻き込む処理 (src/llm.rs)
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
] }
# LLM 計測用の example (examples/llm_bench.rs) 専用。feature llm-bench を指定したときだけビルドする
# openmp は llama.cpp 単体ビルドの既定 (GGML_OPENMP=ON) に揃えるため。common は使わないので外す
llama-cpp-2 = { version = "=0.1.158", optional = true, default-features = false, features = ["openmp"] }

[build-dependencies]
winresource = "0.1"

# UT 辞書の生成 (examples/build_ut_dict.rs) 専用。元データ (.bz2) の展開と表記の NFKC 正規化
[dev-dependencies]
bzip2 = "0.6"
unicode-normalization = "0.1"

[features]
llm-bench = ["dep:llama-cpp-2"]
llm-bench-vulkan = ["llm-bench", "llama-cpp-2/vulkan"]

[[example]]
name = "llm_bench"
required-features = ["llm-bench"]

[[example]]
name = "llm_gen_eval"
required-features = ["llm-bench"]

# 除外規則などの単体テストを cargo test で実行するため
[[example]]
name = "build_ut_dict"
test = true

# 分け方の単体テストを cargo test で実行するため
[[example]]
name = "learning_eval"
test = true

# 設定ツール・単語登録ツールの exe を小さくする (画面の処理は速さより大きさが効く)。
# package 単位の override なので、エンジン本体と依存 crate には効かない
[profile.release.package.quicklime-gui]
opt-level = "z"
codegen-units = 1
